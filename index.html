<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOREMOST 印刷確認</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- 載入中畫面 -->
    <div id="loading" class="flex flex-col items-center justify-center h-screen">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-gray-900 mb-4"></div>
        <p class="text-gray-600 font-bold">驗證身分中...</p>
    </div>

    <!-- 首次註冊畫面 (對應你目前的 registerUser（業務） 邏輯) -->
    <div id="register-view" class="hidden p-6 mt-10 max-w-md mx-auto bg-white rounded-xl shadow-md">
        <h2 class="text-xl font-bold text-gray-800 mb-4">⛳️ 歡迎使用 FOREMOST 印刷系統</h2>
        <p class="text-gray-600 mb-4 text-sm">系統偵測到您尚未建檔，請輸入您的經銷商名稱並選擇您的專屬業務窗口進行綁定。</p>
        
        <!-- 經銷商名稱輸入框 -->
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-1">您的公司/經銷商名稱</label>
            <input type="text" id="reg-name" placeholder="例: 大稻埕高爾夫 (若輸入「我是品牌」可切換為品牌權限)" class="w-full border rounded p-3 text-gray-700">
        </div>
        
        <!-- 選擇專屬業務窗口的下拉選單 (確保 ID 唯一) -->
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-1">選擇您的專屬業務窗口</label>
            <select id="sales_rep_id" class="w-full border rounded p-3 bg-white text-gray-700">
                <option value="">正在載入業務名單...</option>
            </select>
            <p class="text-xs text-gray-500 mt-1">請選擇平時對接您的品牌業務，以便接收後續工單通知。</p>
        </div>

        <button onclick="registerUser()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">
            確認綁定並註冊
        </button>
    </div>

    <!-- 工單確認畫面 -->
    <div id="ticket-view" class="hidden pb-20">
        <div class="bg-gray-800 text-white p-4 sticky top-0 z-10 shadow-md text-center">
            <h1 class="text-lg font-bold">工單圖面確認</h1>
            <p id="user-role-badge" class="text-xs text-gray-300"></p>
        </div>

        <div class="p-4 max-w-lg mx-auto">
            <!-- 工單資訊卡 (規格書規定不顯示價格) -->
            <div class="bg-white rounded-xl shadow p-4 mb-4">
                <div class="flex justify-between border-b pb-2 mb-2">
                    <span class="text-gray-500 text-sm">工單編號</span>
                    <span id="tk-no" class="font-bold text-gray-800">載入中...</span>
                </div>
                <div class="flex justify-between border-b pb-2 mb-2">
                    <span class="text-gray-500 text-sm">球款</span>
                    <span id="tk-inv" class="font-bold text-gray-800">載入中...</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500 text-sm">數量</span>
                    <span id="tk-qty" class="font-bold text-gray-800 text-lg">載入中...</span>
                </div>
            </div>

            <!-- 排版圖顯示區 -->
            <h3 class="font-bold text-gray-700 mb-2">🖼️ 排版預覽圖</h3>
            <div class="bg-white p-2 rounded-xl shadow mb-6">
                <!-- 實務上會從 R2 抓圖片網址 -->
                <img id="tk-img" src="" alt="Mockup" class="w-full h-auto rounded border border-gray-200">
            </div>

            <!-- 動態按鈕區 -->
            <div id="action-buttons">
                <!-- 經銷商用黃色按鈕 -->
                <button id="btn-dist-approve" onclick="approveTicket()" class="hidden w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-4 rounded-xl shadow-lg text-lg mb-4 transition">
                    🟡 經銷商：確認圖面無誤
                </button>
                
                <!-- 品牌用藍色按鈕 -->
                <button id="btn-brand-approve" onclick="approveTicket()" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg text-lg mb-4 transition">
                    🔵 品牌業務：最終放行生產
                </button>

                <!-- 已完成提示 -->
                <div id="status-message" class="hidden text-center text-green-600 font-bold p-4 bg-green-50 rounded-xl border border-green-200"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://foremost-cms.chenex0629.workers.dev";
        const LIFF_ID = "2012411774-22Uk4xDY"; // 去 LINE Developers 後台申請
        
        let currentUser = null;
        let currentTicketId = null;

        // 1. 初始化 LIFF
        async function main() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // 2. 獲取 Token 並向自家 API 驗證
                const idToken = liff.getIDToken();
                const res = await fetch(`${API_URL}/api/liff/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_token: idToken })
                });

                const data = await res.json();
                document.getElementById('loading').classList.add('hidden');

                if (res.status === 404) {
                    // 找不到人，顯示註冊
                    document.getElementById('register-view').classList.remove('hidden');
                    window.tempLineUserId = data.line_user_id;
                } else if (res.ok) {
                    // 驗證成功，載入工單
                    currentUser = data.user;
                    document.getElementById('user-role-badge').innerText = `身分：${currentUser.name} (${currentUser.role})`;
                    loadTicket(); 
                }else {
                    // 🌟 新增這一段：把隱藏的錯誤抓出來顯示！
                    alert(`系統攔截到錯誤 (代碼 ${res.status})：\n${data.error || "未知錯誤"}\n請截圖給開發人員`);
                }

            } catch (err) {
                alert("LIFF 初始化失敗");
            }
        }

        // 3. 處理註冊 (支援選擇專屬業務窗口)
        async function registerUser() {
            const name = document.getElementById('reg-name').value.trim();
            const salesRepId = document.getElementById('sales_rep_id').value;

            if (!name) {
                alert("請輸入名稱！");
                return;
            }

            // 防呆檢查：如果不是品牌端通關密語，卻沒選業務，就阻擋
            if (name !== "我是品牌" && !salesRepId) {
                alert("請選擇您的專屬業務窗口！");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/liff/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        line_user_id: window.tempLineUserId, 
                        name: name,
                        sales_rep_id: salesRepId ? Number(salesRepId) : null
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    alert("✅ 註冊成功！");
                    window.location.reload();
                } else {
                    alert("❌ 註冊失敗: " + (data.error || "未知錯誤"));
                }
            } catch (err) {
                console.error(err);
                alert("❌ 網路連線錯誤，請稍後再試");
            }
        }

        // 4. 抓取真實工單並根據角色顯示按鈕
        async function loadTicket() {
            // 從網址 ?ticket_id=1 抓取 ID
            const urlParams = new URLSearchParams(window.location.search);
            currentTicketId = urlParams.get('ticket_id');
            
            if (!currentTicketId) return alert("無效的工單連結，請從正確的 LINE 通知點擊進入");

            document.getElementById('ticket-view').classList.remove('hidden');

            try {
                // 呼叫後端真實 API 抓取資料
                const res = await fetch(`${API_URL}/api/ticket?id=${currentTicketId}`);
                const ticketData = await res.json();

                if (!res.ok) {
                    return alert(ticketData.error || "無法載入工單");
                }

                // 將真實資料塞入畫面中 (遵守規格：不顯示價格與顏色)
                document.getElementById('tk-no').innerText = ticketData.ticket_no;
                document.getElementById('tk-inv').innerText = ticketData.inventory_name;
                document.getElementById('tk-qty').innerText = ticketData.dozen_qty + ' 打';
                document.getElementById('tk-img').src = ticketData.mockup_key;

                // 狀態機與權限判斷 [根據規格書 4.2]
                const btnDist = document.getElementById('btn-dist-approve');
                const btnBrand = document.getElementById('btn-brand-approve');
                const msg = document.getElementById('status-message');

                if (ticketData.status === 'pending_dist' && currentUser.role === 'distributor') {
                    // 如果目前登入者剛好是這張單的經銷商
                    if (ticketData.distributor_id === currentUser.id) {
                        btnDist.classList.remove('hidden');
                    } else {
                        msg.innerText = "❌ 您無權限簽核其他經銷商的工單";
                        msg.classList.remove('hidden');
                    }
                } 
                else if (ticketData.status === 'pending_brand' && currentUser.role === 'brand') {
                    btnBrand.classList.remove('hidden');
                } 
                else if (ticketData.status === 'pending_print' || ticketData.status === 'completed') {
                    msg.innerText = "✅ 此工單已完成簽核，等待生產中";
                    msg.classList.remove('hidden');
                } else {
                    msg.innerText = "⏳ 等待另一方簽核中...";
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                alert("系統連線錯誤");
            }
        }

        // 5. 送出簽核 (手機端)
        async function approveTicket() {
            if(!confirm("確認要放行此工單嗎？")) return;

            const res = await fetch(`${API_URL}/api/tickets/approve`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    ticket_id: currentTicketId, 
                    user_id: currentUser.id, 
                    role: currentUser.role 
                })
            });

            if (res.ok) {
                // 🌟 讀取 JSON 並攔截庫存警報
                const data = await res.json();
                if (data.alert) {
                    alert(`✅ 簽核成功！\n\n${data.alert}`);
                } else {
                    alert("✅ 簽核成功！");
                }
                window.location.reload();
            } else {
                alert("❌ 簽核失敗，請確認權限或重整頁面");
            }
        }
        // 頁面載入時自動抓取品牌業務清單
        async function loadSalesRepsDropdown() {
            const selectEl = document.getElementById('sales_rep_id');
            try {
                const res = await fetch(`${API_URL}/api/sales-reps`);
                if (!res.ok) throw new Error("無法取得業務名單");
                
                const reps = await res.json();
                
                if (reps.length === 0) {
                    selectEl.innerHTML = '<option value="">目前尚無業務人員，請聯繫管理員</option>';
                    return;
                }

                // 動態產生選項
                selectEl.innerHTML = '<option value="">請選擇您的負責業務</option>' + 
                    reps.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
                    
            } catch (err) {
                console.error(err);
                selectEl.innerHTML = '<option value="">載入業務失敗，請重新整理</option>';
            }
        }

        // 確保在頁面初始化時呼叫它（例如在你的 liff init 成功之後執行 loadSalesRepsDropdown()）

        // 啟動程式
        main();
    </script>
</body>
</html>
